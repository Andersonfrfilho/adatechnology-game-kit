name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the pnpm version comes from "packageManager" in the root package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # every piece comes from the SDK that owns it (CLAUDE.md): a new car, wall, table, person, plant, item or weapon drawn by hand
      # outside its SDK fails here; the known ones are listed in docs/pecas-fora-do-sdk.md (tools/kit-audit/README.md)
      - run: node tools/kit-audit/audit.mjs --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # workspace packages resolve each other through dist, so build first
      - run: pnpm build

      - run: pnpm typecheck

  # Builds the test matrix from packages/*/package.json (packages with a "test" script).
  # Slow packages are split with vitest --shard: add them to SHARDS as package -> shard count.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - uses: actions/checkout@v4

      - id: set
        env:
          SHARDS: '{"@adatechnology/game-vehicles-fleet":16,"@adatechnology/game-floorplan-structure":3}'
        run: |
          node -e '
            const fs = require("fs");
            const shards = JSON.parse(process.env.SHARDS);
            const include = [];
            for (const dir of fs.readdirSync("packages").sort()) {
              const file = `packages/${dir}/package.json`;
              if (!fs.existsSync(file)) continue;
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              if (!pkg.scripts || !pkg.scripts.test) continue;
              const total = shards[pkg.name] || 1;
              for (let shard = 1; shard <= total; shard++) include.push({ pkg: pkg.name, shard, total });
            }
            const json = JSON.stringify(include);
            console.log(JSON.stringify(include, null, 2));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `include=${json}\n`);
          '

  test:
    name: test (${{ matrix.pkg }} ${{ matrix.shard }}/${{ matrix.total }})
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # the package and the workspace packages it depends on
      - name: Build
        run: pnpm --filter "${{ matrix.pkg }}..." run build

      - name: Test
        run: |
          if [ "${{ matrix.total }}" -gt 1 ]; then
            pnpm --filter "${{ matrix.pkg }}" exec vitest run --passWithNoTests --shard=${{ matrix.shard }}/${{ matrix.total }}
          else
            pnpm --filter "${{ matrix.pkg }}" test
          fi

  # The goldens must give the same hashes on a newer Node (V8 changed Math.pow's last bit between Node 22 and 24); one cheap job, not the whole matrix.
  goldens-node-24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter "@adatechnology/game-vehicles-fleet..." run build

      - run: pnpm --filter @adatechnology/golden-tool test

      - name: Fleet goldens that depend on the Node version
        run: pnpm --filter @adatechnology/game-vehicles-fleet exec vitest run tests/golden-cars-2.test.ts tests/golden-cars-1.test.ts tests/team-golden.test.ts tests/digest.test.ts

  # Every example page in headless Chromium (software GL): the room and each area end to end, in pt-BR and en.
  # With all the areas of spec 001 (Phase 8: player, crowd, stories) the job passed 10 min on a runner; on main it now takes 13 to 22 min, and every room page
  # builds a fleet car for the weather's lamp rig (about 10% more per page load), so 40 min leaves room for the Chromium download and a slow runner.
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # the checks load Playwright from NODE_PATH; it is not a dependency of the workspace
      - name: Install Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" playwright@1.58.2
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/playwright/node_modules" >> "$GITHUB_ENV"

      # the test room goes first: the furniture and weapons pages are built over its page
      - name: Build the examples
        run: |
          node examples/test-room/build.mjs
          node examples/interactables-test-area/build.mjs
          node examples/floorplan-test-area/build.mjs
          node examples/vfx-test-area/build.mjs
          node examples/weapons-test-area/build.mjs
          node examples/characters-test-area/build.mjs
          node examples/animals-test-area/build.mjs
          node examples/vehicles-test-area/build.mjs
          node examples/vegetation-test-area/build.mjs
          node examples/urban-test-area/build.mjs
          node examples/audio-test-area/build.mjs
          node examples/weather-test-area/build.mjs
          node examples/player-test-area/build.mjs
          node examples/crowd-test-area/build.mjs
          node examples/stories-test-area/build.mjs

      - name: Check the examples
        run: |
          node examples/test-room/test.mjs
          node examples/interactables-test-area/test.mjs
          node examples/floorplan-test-area/test.mjs
          node examples/vfx-test-area/test.mjs
          node examples/weapons-test-area/test.mjs
          node examples/characters-test-area/test.mjs
          node examples/animals-test-area/test.mjs
          node examples/vehicles-test-area/test.mjs
          node examples/vegetation-test-area/test.mjs
          node examples/urban-test-area/test.mjs
          node examples/audio-test-area/test.mjs
          node examples/weather-test-area/test.mjs
          node examples/player-test-area/test.mjs
          node examples/crowd-test-area/test.mjs
          node examples/stories-test-area/test.mjs

  # Every drawn thing of every area of the test room comes from the SDK that owns it (CLAUDE.md, "Nada desenhado à mão"): tools/kit-audit/scene.mjs opens
  # each area and fails on anything with no origin mark of a kit builder (markKitOrigin) that is not pending in tools/kit-audit/allowlist.json (`drawn`).
  # A job of its own: the examples job is already close to its limit.
  scene-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Install Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" playwright@1.58.2
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/playwright/node_modules" >> "$GITHUB_ENV"

      - name: Build the test room
        run: node examples/test-room/build.mjs

      - name: Check where every drawn piece comes from
        run: node tools/kit-audit/scene.mjs --check

  # Timing of the kit's 3D builders (tools/shapes-bench): medians as ratios to a calibration loop, against baseline.json.
  # Fails when a builder is twice as slow as its baseline, or a group (props3d, household, items, weapons, animals...) 1.5 times, after
  # re-timing the suspects; the table goes to the job summary and the run to an artifact (bench --baseline-from turns it into a baseline).
  shapes-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter "@adatechnology/shapes-bench-tool..." run build

      - run: pnpm --filter @adatechnology/shapes-bench-tool test

      - run: node --expose-gc tools/shapes-bench/dist/cli.js --check --json shapes-bench-run.json

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shapes-bench-run
          path: shapes-bench-run.json
          if-no-files-found: ignore

  # One stable required check; Release waits on the whole "CI" workflow.
  ci-ok:
    if: always()
    needs: [lint, typecheck, test, goldens-node-24, examples, scene-origin, shapes-bench]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "A required job did not succeed: ${{ join(needs.*.result, ', ') }}"
            exit 1
          fi
