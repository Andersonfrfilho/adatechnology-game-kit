name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the pnpm version comes from "packageManager" in the root package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # workspace packages resolve each other through dist, so build first
      - run: pnpm build

      - run: pnpm typecheck

  # Builds the test matrix from packages/*/package.json (packages with a "test" script).
  # Slow packages are split with vitest --shard: add them to SHARDS as package -> shard count.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - uses: actions/checkout@v4

      - id: set
        env:
          SHARDS: '{"@adatechnology/game-vehicles-fleet":16,"@adatechnology/game-floorplan-structure":2}'
        run: |
          node -e '
            const fs = require("fs");
            const shards = JSON.parse(process.env.SHARDS);
            const include = [];
            for (const dir of fs.readdirSync("packages").sort()) {
              const file = `packages/${dir}/package.json`;
              if (!fs.existsSync(file)) continue;
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              if (!pkg.scripts || !pkg.scripts.test) continue;
              const total = shards[pkg.name] || 1;
              for (let shard = 1; shard <= total; shard++) include.push({ pkg: pkg.name, shard, total });
            }
            const json = JSON.stringify(include);
            console.log(JSON.stringify(include, null, 2));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `include=${json}\n`);
          '

  test:
    name: test (${{ matrix.pkg }} ${{ matrix.shard }}/${{ matrix.total }})
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # the package and the workspace packages it depends on
      - name: Build
        run: pnpm --filter "${{ matrix.pkg }}..." run build

      - name: Test
        run: |
          if [ "${{ matrix.total }}" -gt 1 ]; then
            pnpm --filter "${{ matrix.pkg }}" exec vitest run --passWithNoTests --shard=${{ matrix.shard }}/${{ matrix.total }}
          else
            pnpm --filter "${{ matrix.pkg }}" test
          fi

  # The goldens must give the same hashes on a newer Node (V8 changed Math.pow's last bit between Node 22 and 24); one cheap job, not the whole matrix.
  goldens-node-24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter "@adatechnology/game-vehicles-fleet..." run build

      - run: pnpm --filter @adatechnology/golden-tool test

      - name: Fleet goldens that depend on the Node version
        run: pnpm --filter @adatechnology/game-vehicles-fleet exec vitest run tests/golden-cars-2.test.ts tests/golden-cars-1.test.ts tests/team-golden.test.ts tests/digest.test.ts

  # The three example pages in headless Chromium (software GL): the checks that exercise the room, the furniture area and the weapons area end to end.
  # Measured locally: build 18 s, the three checks 31 s; on a runner the job should stay under 5 min with the Chromium download.
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # the checks load Playwright from NODE_PATH; it is not a dependency of the workspace
      - name: Install Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" playwright@1.58.2
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/playwright/node_modules" >> "$GITHUB_ENV"

      # the test room goes first: the furniture and weapons pages are built over its page
      - name: Build the examples
        run: |
          node examples/test-room/build.mjs
          node examples/interactables-test-area/build.mjs
          node examples/weapons-test-area/build.mjs
          node examples/characters-test-area/build.mjs
          node examples/animals-test-area/build.mjs
          node examples/vehicles-test-area/build.mjs

      - name: Check the examples
        run: |
          node examples/test-room/test.mjs
          node examples/interactables-test-area/test.mjs
          node examples/weapons-test-area/test.mjs
          node examples/characters-test-area/test.mjs
          node examples/animals-test-area/test.mjs
          node examples/vehicles-test-area/test.mjs

  # One stable required check; Release waits on the whole "CI" workflow.
  ci-ok:
    if: always()
    needs: [lint, typecheck, test, goldens-node-24, examples]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "A required job did not succeed: ${{ join(needs.*.result, ', ') }}"
            exit 1
          fi
