name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the pnpm version comes from "packageManager" in the root package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # every piece comes from the SDK that owns it (CLAUDE.md): a new car, wall, table, person, plant, item or weapon drawn by hand
      # outside its SDK fails here; the known ones are listed in docs/pecas-fora-do-sdk.md (tools/kit-audit/README.md)
      - run: node tools/kit-audit/audit.mjs --check

      # a local sound pack (tools/local-audio) never enters git: no local config, no local-audio folder, and no audio but the kit's own sounds (the manifest's CC0 and CC-BY files in packages/game-audio/assets/sfx)
      - run: node tools/local-audio/local-audio.mjs guard-git

      # which browser suites the pre-push runs for a diff (tools/gpu/select-suites.mjs): pure Node, no page and no GPU
      - run: pnpm --filter @adatechnology/gpu-tools test

  # The workspace is built once here and every job that needs it downloads the dist folders (workspace packages resolve each other through
  # dist), instead of each job spending two minutes on its own `pnpm build`.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            packages/*/dist
            tools/*/dist
          retention-days: 1
          if-no-files-found: error

  typecheck:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: dist

      - run: pnpm typecheck

  # Builds the test matrix from packages/*/package.json (packages with a "test" script). Most packages test in a few seconds, so a job per package
  # spent more time in setup and in the queue (the account runs about 20 jobs at once) than in the tests: they are packed into GROUPS jobs,
  # balanced by WEIGHTS (seconds of `vitest run` on CI; 10 for a package not listed). Slow packages are split with vitest --shard instead: add
  # them to SHARDS as package -> shard count, and each shard is a job of its own.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - uses: actions/checkout@v4

      - id: set
        env:
          SHARDS: '{"@adatechnology/game-vehicles-fleet":8,"@adatechnology/game-floorplan-structure":3,"@adatechnology/game-vehicles-three":4}'
          GROUPS: '6'
          WEIGHTS: '{"@adatechnology/game-floorplan-post-apocalyptic":162,"@adatechnology/game-weapons-three":144,"@adatechnology/game-floorplan-three":123,"@adatechnology/game-floorplan-commercial":69,"@adatechnology/game-vehicles":66,"@adatechnology/game-floorplan-residential":48,"@adatechnology/game-crowd":39,"@adatechnology/game-test-room":25,"@adatechnology/game-interactables-household":20,"@adatechnology/game-characters-three":19,"@adatechnology/game-floorplan-rural":18,"@adatechnology/game-items-three":18,"@adatechnology/game-vegetation-three":17,"@adatechnology/game-crowd-three":15,"@adatechnology/game-fluids":15,"@adatechnology/game-destruction":14,"@adatechnology/game-floorplan-interactables":13}'
        run: |
          node -e '
            const fs = require("fs");
            const shards = JSON.parse(process.env.SHARDS);
            const weights = JSON.parse(process.env.WEIGHTS);
            const include = [];
            const single = [];
            for (const dir of fs.readdirSync("packages").sort()) {
              const file = `packages/${dir}/package.json`;
              if (!fs.existsSync(file)) continue;
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              if (!pkg.scripts || !pkg.scripts.test) continue;
              const total = shards[pkg.name];
              if (total) for (let shard = 1; shard <= total; shard++) include.push({ name: `${pkg.name.replace("@adatechnology/", "")} ${shard}/${total}`, pkgs: pkg.name, shard, total });
              else single.push(pkg.name);
            }
            // the heaviest first, each into the lightest group so far
            const groups = Array.from({ length: Number(process.env.GROUPS) }, () => ({ weight: 0, pkgs: [] }));
            single.sort((a, b) => (weights[b] ?? 10) - (weights[a] ?? 10) || a.localeCompare(b));
            for (const name of single) {
              const group = groups.reduce((low, g) => (g.weight < low.weight ? g : low));
              group.pkgs.push(name);
              group.weight += weights[name] ?? 10;
            }
            const used = groups.filter((g) => g.pkgs.length);
            used.forEach((g, i) => include.push({ name: `group ${i + 1}/${used.length}`, pkgs: g.pkgs.sort().join(" "), shard: 1, total: 1 }));
            console.log(JSON.stringify(include, null, 2));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `include=${JSON.stringify(include)}\n`);
          '

  test:
    name: test (${{ matrix.name }})
    needs: [matrix, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: dist

      # a group tests its packages one at a time, as the pre-push hook does (in parallel the long golden loops miss vitest's 5 s timeout), and
      # goes on after a failure so the log shows every package that failed
      - name: Test
        run: |
          if [ "${{ matrix.total }}" -gt 1 ]; then
            pnpm --filter "${{ matrix.pkgs }}" exec vitest run --passWithNoTests --shard=${{ matrix.shard }}/${{ matrix.total }}
          else
            filters=""
            for pkg in ${{ matrix.pkgs }}; do filters="$filters --filter $pkg"; done
            pnpm $filters --workspace-concurrency=1 --no-bail run test
          fi

  # The goldens must give the same hashes on a newer Node (V8 changed Math.pow's last bit between Node 22 and 24); one cheap job, not the whole matrix.
  goldens-node-24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter "@adatechnology/game-vehicles-fleet..." run build

      - run: pnpm --filter @adatechnology/golden-tool test

      - name: Fleet goldens that depend on the Node version
        run: pnpm --filter @adatechnology/game-vehicles-fleet exec vitest run tests/golden-cars-2.test.ts tests/golden-cars-1.test.ts tests/team-golden.test.ts tests/digest.test.ts

  # Every example page in headless Chromium (software GL): the room and each area end to end, in pt-BR and en.
  # In shards, each a job of its own: one job with every area reached the 40 min limit. A new area goes in the shard with the least time.
  # An entry `area:part` runs one part of that area's check (EXAMPLE_PART in its test.mjs): the test room's scenarios and views in two halves each, and hands; the
  # furniture area's checks in each language and its screenshots.
  # Nothing here opens a page in a browser (CLAUDE.md, "Testes de GPU e navegador"): the test room and the example areas (examples/*/test.mjs), where every
  # drawn piece comes from and what it costs (tools/kit-audit/scene.mjs, cost.mjs), the memory cycles (examples/test-room/leak.mjs) and the frame budgets
  # (examples/test-room/perf.mjs) run before a push on the machine with the GPU (.githooks/pre-push: tools/gpu/browser-checks.mjs, tools/gpu/perf-gate.mjs).

  # Timing of the kit's 3D builders (tools/shapes-bench): medians as ratios to a calibration loop, against baseline.json.
  # Fails when a builder is twice as slow as its baseline, or a group (props3d, household, items, weapons, animals...) 1.5 times, after
  # re-timing the suspects; the table goes to the job summary and the run to an artifact (bench --baseline-from turns it into a baseline).
  shapes-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter "@adatechnology/shapes-bench-tool..." run build

      - run: pnpm --filter @adatechnology/shapes-bench-tool test

      - run: node --expose-gc tools/shapes-bench/dist/cli.js --check --json shapes-bench-run.json

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shapes-bench-run
          path: shapes-bench-run.json
          if-no-files-found: ignore

  # Layer rules and package.json policy (spec 005). Both read sources only, so no build is needed.
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # fails on a layer violation that is not in .dependency-cruiser-known-violations.json
      - run: pnpm check:layers

      - run: pnpm check:packages

  # One stable required check; Release waits on the whole "CI" workflow.
  ci-ok:
    if: always()
    needs: [lint, build, typecheck, test, goldens-node-24, shapes-bench, architecture]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "A required job did not succeed: ${{ join(needs.*.result, ', ') }}"
            exit 1
          fi
